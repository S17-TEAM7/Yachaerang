services:
  app-blue:
    image: ghcr.io/${ORG_NAME}/spring-api:latest
    ports:
      - "8080:8080"
    env_file:
      - /home/ubuntu/backend/docker/.env
    volumes:
      - /home/ubuntu/logs:/app/logs
    depends_on:
      - redis
    networks:
      - my-network
    container_name: app-blue

  app-green:
    image: ghcr.io/${ORG_NAME}/spring-api:latest
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - /home/ubuntu/logs:/app/logs
    depends_on:
      - redis
    networks:
      - my-network
    container_name: app-green

  redis-stack:
    image: redis/redis-stack-server:7.4.0-v2
    container_name: redis-stack
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - /home/ubuntu/redis/redis_data:/data
      - /home/ubuntu/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - my-network

  nginx:
    image: nginx:1.27.4
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - /home/ubuntu/backend/deploy/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-blue
      - app-green
    networks:
      - my-network
    restart: always

volumes:
  redis_data:

networks:
  my-network:
    driver: bridge