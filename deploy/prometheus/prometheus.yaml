global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'spring-blue'
    metrics_path: '/actuator/prometheus'
    scheme: http
    static_configs:
      - targets: ['app-blue:8080']

  - job_name: 'spring-green'
    metrics_path: '/actuator/prometheus'
    scheme: http
    static_configs:
      - targets: ['app-green:8080']

  - job_name: 'spring-batch'
    metrics_path: '/actuator/prometheus'
    scheme: http
    static_configs:
      - targets: ['spring-batch:8082']

  - job_name: 'batch_server_scrape'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
